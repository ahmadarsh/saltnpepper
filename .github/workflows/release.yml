name: Build release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        if: runner.os != 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install native dependencies (Mac)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m pip install -r requirements.txt -r desktop/requirements-build.txt
      - name: Run regression tests (Mac)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m unittest pcb_simulator.test_server pcb_simulator.test_backend pcb_simulator.viewer.test_results
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: zsh "desktop/Build Mac App.command"
      - name: Test packaged Mac backend
        if: runner.os == 'macOS'
        run: .venv/bin/python desktop/smoke_test.py desktop/backend-dist/salt-pepper-backend
      - name: Build Windows app and test packaged backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "desktop/Build Windows App.ps1"'
      - name: Run regression tests (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m unittest pcb_simulator.test_server pcb_simulator.test_backend pcb_simulator.viewer.test_results
      - name: Collect copyleft dependency sources
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/fetch_dependency_sources.py
      - name: Assemble clean source and checksums
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/prepare_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: salt-and-pepper-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/windows/*-setup.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/dependency-sources/**
          if-no-files-found: error
