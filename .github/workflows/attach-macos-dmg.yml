name: Create and attach Mac DMG
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful native build run ID
        required: true
        default: '41480370531'
      release_tag:
        description: Existing draft release tag
        required: true
        default: v0.5.0
permissions:
  actions: read
  contents: write
jobs:
  dmg:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check successful build and download Mac artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion) == success ]]
          gh run download "$BUILD_RUN_ID" --name salt-and-pepper-macos-arm64 --dir artifact
      - name: Create and verify drag-and-drop DMG
        shell: bash
        run: |
          set -euo pipefail
          mac_zip=$(find artifact -type f -name 'Salt and Pepper Mac.zip' -print -quit)
          [[ -n "$mac_zip" ]]
          mkdir staging
          ditto -x -k "$mac_zip" staging
          codesign --verify --deep --strict 'staging/Salt and Pepper.app'
          ln -s /Applications staging/Applications
          version="${RELEASE_TAG#v}"
          dmg="Salt-and-Pepper-${version}-macOS-arm64.dmg"
          hdiutil create -volname 'Salt and Pepper' -srcfolder staging -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > MacOS-SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$dmg" MacOS-SHA256SUMS.txt --clobber
